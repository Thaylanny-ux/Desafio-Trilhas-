<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Números Pares de 0 a 20</title>
    <script>
        function exibirNumerosPares() {
            for (let numero = 0; numero <= 20; numero++) {
                if (numero % 2 === 0) {
                    console.log(numero);
                }
            }
        }
    </script>
</head>
<body onload="exibirNumerosPares()">
</body>
</html>
