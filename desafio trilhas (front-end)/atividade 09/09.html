<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imprimir Números de 1 a 10</title>
    <script>
        function imprimirNumeros() {
            for (let i = 1; i <= 10; i++) {
                document.write(i + "<br>");
            }
        }
    </script>
</head>
<body onload="imprimirNumeros()">
</body>
</html>
