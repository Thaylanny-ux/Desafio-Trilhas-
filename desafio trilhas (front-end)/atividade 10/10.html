<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Digite o Número</title>
</head>
<body>
    <script>
        let numero;

        do {
            numero = parseInt(prompt("Digite um número:"));
        } while (numero !== 5);

        alert("Você digitou o número 5!");
    </script>
</body>
</html>
