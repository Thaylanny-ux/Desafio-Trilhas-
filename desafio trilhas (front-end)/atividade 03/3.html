<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <title>Preço com Desconto</title>
    <script>
        function calcularPrecoComDesconto() {
            let preco = 50;
            let desconto = 0.2;
            let valorDesconto = preco * desconto;
            let precoFinal = preco - valorDesconto;

            console.log("Preço original: R$ " + preco.toFixed(2));
            console.log("Desconto: R$ " + valorDesconto.toFixed(2));
            console.log("Preço final com desconto: R$ " + precoFinal.toFixed(2));
        }
             
        window.onload = calcularPrecoComDesconto;
    </script>
</head>
<body>
</body>
</html>
